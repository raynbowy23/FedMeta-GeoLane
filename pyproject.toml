[project]
name = "fedmeta-geolane"
version = "0.1.0"
description = "A federated meta-learning framework for lane detection"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [
    {name = "raynbowy23", email = "tamaru@wisc.edu"},
]

keywords = [
    "graph",
    "lane detection",
    "federated learning",
    "meta-learning",
    "transportation",
    "digital twin",
]

dependencies = [
    "numpy==2.2.0",
    "pytz==2024.2",
    "opencv-python==4.10.0.84",
    "ultralytics==8.3.168",
    "pandas==2.2.3",
    "polars==1.31.0",
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "torch-geometric>=2.6.1",
    "tqdm==4.65.0",
    "scikit-learn==1.6.1",
    "sumolib>=1.23.1",
    "seaborn>=0.13.2",
    "shapely>=2.1.1",
    "pyproj>=3.7.1",
    "joblib==1.4.2",
    "mlflow>=3.1.1",
    "lxml==5.3.1",
    "lap>=0.5.12",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
